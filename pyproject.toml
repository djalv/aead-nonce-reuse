[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nonce-reuse-study"
version = "0.1.0"
description = "Experimental study of nonce reuse in AES-GCM and ChaCha20-Poly1305"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cryptography==50.0.2",
    "matplotlib==3.11.2",
]

[project.scripts]
nonce-reuse = "nonce_reuse.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nonce_reuse"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/results",
    "/report",
    "/slides",
    "/pyproject.toml",
    "/README.md",
    "/requirements.txt",
    "/uv.lock",
    "/.python-version",
    "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["results/measurement-source"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]
